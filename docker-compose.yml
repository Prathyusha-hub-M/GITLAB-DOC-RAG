version: "3.9"

services:
  rag-api:
    build: .
    container_name: gitlab-rag-api
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - ./data:/app/data

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: